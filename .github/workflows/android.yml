name: Android · capítulo I
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.3

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-linux-android-4.6.3-v1
      - name: Install pinned Godot and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          curl --fail -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-editor
          install /tmp/godot-editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$HOME/.local/bin/godot"
          curl --fail -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j /tmp/templates.tpz 'templates/android*' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Add engine to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check imports, gameplay, saves and updater rules
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/run_checks.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'platforms;android-35'
      - name: Prepare preview version and stable TEST signing identity
        run: python3 tools/prepare_build.py --code "$((1000 + GITHUB_RUN_NUMBER))"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build Android installation bridge
        shell: bash
        run: |
          set -euo pipefail
          android/build/gradlew -p native-updater assembleRelease --no-daemon
          mkdir -p addons/linea_updater/bin
          cp native-updater/build/outputs/aar/linea-updater-release.aar addons/linea_updater/bin/linea-updater.aar
      - name: Export signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --import --quit 2>&1 | tee build/import.log
          godot --headless --path . --export-release Android build/TheLastLinea.apk 2>&1 | tee build/export.log
          python3 -c "from pathlib import Path; assert Path('build/TheLastLinea.apk').stat().st_size > 1000000"
          python3 tools/verify_apk.py --build-tools "$ANDROID_HOME/build-tools/36.1.0"
      - name: Enable accelerated Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual ARM64 APK startup and chapter on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: python3 tools/android_smoke.py --apk build/TheLastLinea.apk --output build/android-startup --require-ready --exercise --seconds 15
      - name: Create release manifest
        env:
          RELEASE_TAG: v${{ env.GAME_VERSION }}-build.${{ github.run_number }}
        run: python3 tools/release_manifest.py
      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TheLastLinea-Android-${{ github.run_number }}
          path: |
            build/TheLastLinea.apk
            build/update.json
            build/SHA256SUMS.txt
            build/APK-verification.txt
            build/*.log
            build/android-startup/
          if-no-files-found: warn
      - name: Publish playable preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GAME_VERSION }}-build.${{ github.run_number }}
          name: Capítulo I · ${{ env.GAME_VERSION }} · teste ${{ github.run_number }}
          make_latest: true
          prerelease: false
          body_path: build/RELEASE_NOTES.md
          files: |
            build/TheLastLinea.apk
            build/update.json
            build/SHA256SUMS.txt
