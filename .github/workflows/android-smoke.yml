name: Android startup diagnostic
on:
  push:
    branches: [diagnose/android-startup]
    paths: ['.github/workflows/android-smoke.yml', 'tools/android_smoke.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download reported release
        run: |
          mkdir -p build
          curl --fail -L --retry 3 -o build/TheLastLinea.apk https://github.com/emanoelb5-lgtm/the-last-Linea/releases/download/v0.2.0-build.5/TheLastLinea.apk
      - name: Launch published ARM64 APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: python3 tools/android_smoke.py --apk build/TheLastLinea.apk --output build/android-startup --seconds 35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-diagnostic
          path: build/android-startup
          if-no-files-found: warn
